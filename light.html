<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magic Match Wish</title>

<!-- Readable Beautiful Font -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    background: radial-gradient(circle, #111, #000);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    font-family: "Nunito", sans-serif;
  }

  .instruction {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    color: #ffcc66;
    font-size: 1.6em;
    opacity: 0.9;
    letter-spacing: 0.5px;
  }

  .drop-zone {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 160px;
    border: 2px dashed rgba(255,180,80,0.45);
    border-radius: 14px;
    box-shadow: 0 0 30px rgba(255,150,50,0.35);
    pointer-events: none;
  }

  .text-box {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }

  .line {
    color: gold;
    opacity: 0;
    transform: translateY(20px);
    margin: 18px 0;
    font-weight: 600;
    text-shadow:
      0 0 10px gold,
      0 0 30px orange;
    transition:
      opacity 2s ease,
      transform 2s ease;
  }

  .line.first {
    font-size: 3.8em;
    font-weight: 700;
  }

  .line.other {
    font-size: 2.2em;
  }

  .match {
    position: absolute;
    width: 22px;
    height: 90px;
    left: 50%;
    top: 60px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, #ffb347, #3b2b1f);
    border-radius: 4px;
    box-shadow: 0 0 22px rgba(255, 120, 0, 0.9);
    touch-action: none;
    cursor: grab;
    z-index: 10;
  }

  .fire {
    position: absolute;
    top: -38px;
    left: 50%;
    width: 30px;
    height: 50px;
    background: radial-gradient(circle, #fff6a5, orange, red);
    border-radius: 50%;
    transform: translateX(-50%);
    animation: flicker 0.18s infinite alternate;
  }

  @keyframes flicker {
    from { transform: translateX(-50%) scale(1); }
    to   { transform: translateX(-50%) scale(1.15); }
  }

  /* Floating particles */
  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(255, 200, 120, 0.8);
    border-radius: 50%;
    animation: floatUp 8s linear infinite;
  }

  @keyframes floatUp {
    from {
      transform: translateY(100vh);
      opacity: 0;
    }
    10% { opacity: 1; }
    to {
      transform: translateY(-20vh);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<div class="instruction">matchstick neeche le jao</div>

<div class="drop-zone"></div>

<div class="text-box">
  <div class="line first">oye.. my pgli ✨</div>
  <div class="line other">pgli tum sach mein bahut sweet ho 🥰</div>
  <div class="line other">main khud ko lucky maanta hoon tum jaisi dost ke liye 😌</div>
  <div class="line other">aur haan… tum sabse best ho.. diamond ho 💛</div>
  <div class="line other">You're always mera lovely dost 😍😽</div>
  <div class="line other">hamesha khush rehna aur khayal rakhna 🥹</div>
</div>

<div class="match" id="match">
  <div class="fire"></div>
</div>

<script>
const match = document.getElementById("match");
const lines = document.querySelectorAll(".line");
const dropZone = document.querySelector(".drop-zone");

let offsetX = 0, offsetY = 0;
let dragging = false;
let locked = false;

// Particles
for (let i = 0; i < 25; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDelay = Math.random() * 8 + "s";
  p.style.opacity = Math.random();
  document.body.appendChild(p);
}

function startDrag(e) {
  if (locked) return;
  dragging = true;
  const r = match.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  offsetX = p.clientX - r.left;
  offsetY = p.clientY - r.top;
}

function drag(e) {
  if (!dragging || locked) return;
  const p = e.touches ? e.touches[0] : e;
  match.style.left = (p.clientX - offsetX) + "px";
  match.style.top = (p.clientY - offsetY) + "px";
  checkDrop();
}

function checkDrop() {
  const m = match.getBoundingClientRect();
  const d = dropZone.getBoundingClientRect();
  if (m.left > d.left && m.right < d.right && m.top > d.top && m.bottom < d.bottom) {
    lockMatch();
  }
}

function lockMatch() {
  locked = true;
  match.style.left = "50%";
  match.style.top = "26%";
  match.style.transform = "translateX(-50%)";
  revealText();
}

function revealText() {
  let delay = 0;
  lines.forEach(line => {
    setTimeout(() => {
      line.style.opacity = 1;
      line.style.transform = "translateY(0)";
    }, delay += 2200);
  });
}

function endDrag() {
  dragging = false;
}

match.addEventListener("mousedown", startDrag);
match.addEventListener("touchstart", startDrag, { passive: false });
document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, { passive: false });
document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);
</script>

</body>
</html>
