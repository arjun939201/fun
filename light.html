<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magic Match Reveal</title>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle at center, #111, #000);
    overflow: hidden;
    height: 100vh;
    user-select: none;
    cursor: grab;
  }

  .text {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3.5em;
    font-family: "Segoe UI", sans-serif;
    color: gold;
    opacity: 0.15; /* visible BEFORE touching */
    filter: blur(8px);
    text-shadow:
      0 0 8px gold,
      0 0 15px orange,
      0 0 30px red;
    pointer-events: none;
  }

  .match {
    position: absolute;
    width: 22px;
    height: 90px;
    left: 50%;
    top: 65%;
    transform: translate(-50%, -50%);
    background: linear-gradient(to bottom, #ffb347, #3b2b1f);
    border-radius: 4px;
    box-shadow: 0 0 15px rgba(255, 80, 0, 0.8);
    touch-action: none;
  }

  .fire {
    position: absolute;
    top: -35px;
    left: 50%;
    width: 26px;
    height: 45px;
    background: radial-gradient(circle, #fff176, orange, red);
    border-radius: 50%;
    transform: translateX(-50%);
    animation: flicker 0.15s infinite alternate;
  }

  .light {
    position: absolute;
    top: -50px;
    left: 50%;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, rgba(255,180,80,0.45), transparent 70%);
    transform: translateX(-50%);
    pointer-events: none;
  }

  @keyframes flicker {
    from {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }
    to {
      transform: translateX(-50%) scale(1.15);
      opacity: 0.85;
    }
  }
</style>
</head>

<body>

<div class="text" id="wishText">Wish My Pgli ✨</div>

<div class="match" id="match">
  <div class="fire"></div>
  <div class="light"></div>
</div>

<script>
const match = document.getElementById("match");
const text = document.getElementById("wishText");

let offsetX = 0, offsetY = 0;
let dragging = false;

function startDrag(e) {
  dragging = true;
  const rect = match.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  offsetX = p.clientX - rect.left;
  offsetY = p.clientY - rect.top;
}

function drag(e) {
  if (!dragging) return;
  const p = e.touches ? e.touches[0] : e;

  match.style.left = p.clientX - offsetX + "px";
  match.style.top = p.clientY - offsetY + "px";

  glowEffect();
}

function endDrag() {
  dragging = false;
}

function glowEffect() {
  const textRect = text.getBoundingClientRect();
  const matchRect = match.getBoundingClientRect();

  const dx =
    (textRect.left + textRect.width / 2) -
    (matchRect.left + matchRect.width / 2);
  const dy =
    (textRect.top + textRect.height / 2) -
    (matchRect.top + matchRect.height / 2);

  const distance = Math.hypot(dx, dy);

  const revealDistance = 450; // appears early
  const glowDistance = 200;   // full glow close

  let visibility = 1 - distance / revealDistance;
  visibility = Math.min(Math.max(visibility, 0.15), 1);

  let glowPower = 1 - distance / glowDistance;
  glowPower = Math.min(Math.max(glowPower, 0), 1);

  text.style.opacity = visibility;
  text.style.filter = `blur(${8 - glowPower * 8}px)`;

  text.style.textShadow = `
    0 0 ${8 + glowPower * 30}px gold,
    0 0 ${15 + glowPower * 60}px orange,
    0 0 ${30 + glowPower * 90}px red
  `;
}

// Mouse + Touch events
match.addEventListener("mousedown", startDrag);
match.addEventListener("touchstart", startDrag, { passive: false });

document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, { passive: false });

document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);
</script>

</body>
</html>
