<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magic Match Wish</title>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle, #111, #000);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    font-family: "Segoe UI", sans-serif;
  }

  .instruction {
    position: absolute;
    top: 12px;
    width: 100%;
    text-align: center;
    color: #ffcc66;
    font-size: 1.2em;
    opacity: 0.9;
    letter-spacing: 1px;
  }

  /* Drop zone */
  .drop-zone {
    position: absolute;
    top: 26%;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 140px;
    border: 2px dashed rgba(255,180,80,0.5);
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(255,150,50,0.3);
    pointer-events: none;
  }

  .text-box {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }

  .line {
    color: gold;
    opacity: 0;
    filter: blur(12px);
    margin: 16px 0;
    text-shadow:
      0 0 10px gold,
      0 0 30px orange,
      0 0 60px red;
    transition: opacity 1.2s linear, filter 1.2s linear;
  }

  .line.first {
    font-size: 3.2em;
  }

  .line.other {
    font-size: 2.2em;
  }

  .match {
    position: absolute;
    width: 22px;
    height: 90px;
    left: 50%;
    top: 90px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, #ffb347, #3b2b1f);
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(255, 100, 0, 0.9);
    touch-action: none;
  }

  .fire {
    position: absolute;
    top: -36px;
    left: 50%;
    width: 28px;
    height: 48px;
    background: radial-gradient(circle, #fff6a5, orange, red);
    border-radius: 50%;
    transform: translateX(-50%);
    animation: flicker 0.18s infinite alternate;
  }

  @keyframes flicker {
    from { transform: translateX(-50%) scale(1); }
    to   { transform: translateX(-50%) scale(1.15); }
  }
</style>
</head>

<body>

<div class="instruction">matchstick neeche le jao</div>
<div class="drop-zone"></div>

<div class="text-box" id="textBox">
  <div class="line first" id="line1">Wish my pgli ✨</div>
  <div class="line other">pgli tum sach mein bahut hi sweet ho</div>
  <div class="line other">main khud ko lucky maanta hoon tum jaisi dost ke liye</div>
  <div class="line other">aur haan… tum sabse best ho 💛</div>
</div>

<div class="match" id="match">
  <div class="fire"></div>
</div>

<script>
const match = document.getElementById("match");
const line1 = document.getElementById("line1");
const lines = document.querySelectorAll(".line");
const dropZone = document.querySelector(".drop-zone");

let offsetX = 0, offsetY = 0;
let dragging = false;
let locked = false;
let revealed = false;

function startDrag(e) {
  if (locked) return;
  dragging = true;
  const r = match.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  offsetX = p.clientX - r.left;
  offsetY = p.clientY - r.top;
}

function drag(e) {
  if (!dragging || locked) return;
  const p = e.touches ? e.touches[0] : e;

  let x = p.clientX - offsetX;
  let y = p.clientY - offsetY;

  match.style.left = x + "px";
  match.style.top = y + "px";

  checkDrop();
}

function checkDrop() {
  const m = match.getBoundingClientRect();
  const d = dropZone.getBoundingClientRect();

  if (
    m.left > d.left &&
    m.right < d.right &&
    m.top > d.top &&
    m.bottom < d.bottom
  ) {
    lockMatch();
  }
}

function lockMatch() {
  locked = true;
  match.style.left = "50%";
  match.style.top = "30%";
  match.style.transform = "translateX(-50%)";

  glowAndReveal();
}

function glowAndReveal() {
  line1.style.opacity = 1;
  line1.style.filter = "blur(0)";

  let delay = 1200;
  for (let i = 1; i < lines.length; i++) {
    setTimeout(() => {
      lines[i].style.opacity = 1;
      lines[i].style.filter = "blur(0)";
    }, delay += 1200);
  }

  setTimeout(speakText, delay + 500);
}

function speakText() {
  if (!("speechSynthesis" in window)) return;

  const msg = new SpeechSynthesisUtterance(
    "Wish my pagli. Pagli tum sach mein bahut hi sweet ho. " +
    "Main khud ko lucky maanta hoon tum jaisi dost ke liye. " +
    "Aur haan, tum sabse best ho."
  );
  msg.rate = 0.85;
  msg.pitch = 1.1;
  msg.volume = 0.8;
  speechSynthesis.speak(msg);
}

function endDrag() {
  dragging = false;
}

// Events
match.addEventListener("mousedown", startDrag);
match.addEventListener("touchstart", startDrag, { passive: false });

document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, { passive: false });

document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);
</script>

</body>
</html>
