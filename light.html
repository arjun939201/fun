<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Precise Match Glow</title>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle, #111, #000);
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  .text {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3.5em;
    font-family: "Segoe UI", sans-serif;
    color: gold;
    opacity: 0;
    filter: blur(10px);
    pointer-events: none;
    text-shadow:
      0 0 10px gold,
      0 0 30px orange,
      0 0 60px red;
  }

  .match {
    position: absolute;
    width: 22px;
    height: 90px;
    left: 50%;
    top: 65%;
    transform: translate(-50%, -50%);
    background: linear-gradient(to bottom, #ffb347, #3b2b1f);
    border-radius: 4px;
    box-shadow: 0 0 18px rgba(255, 100, 0, 0.9);
    touch-action: none;
  }

  .fire {
    position: absolute;
    top: -35px;
    left: 50%;
    width: 26px;
    height: 45px;
    background: radial-gradient(circle, #fff176, orange, red);
    border-radius: 50%;
    transform: translateX(-50%);
    animation: flicker 0.15s infinite alternate;
  }

  @keyframes flicker {
    from { transform: translateX(-50%) scale(1); }
    to   { transform: translateX(-50%) scale(1.15); }
  }
</style>
</head>

<body>

<div class="text" id="wishText">Wish My Pgli ✨</div>

<div class="match" id="match">
  <div class="fire"></div>
</div>

<script>
const match = document.getElementById("match");
const text = document.getElementById("wishText");

let offsetX = 0, offsetY = 0;
let dragging = false;

const GLOW_PADDING = 40; // matches blur radius visually

function startDrag(e) {
  dragging = true;
  const r = match.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  offsetX = p.clientX - r.left;
  offsetY = p.clientY - r.top;
}

function drag(e) {
  if (!dragging) return;
  const p = e.touches ? e.touches[0] : e;

  let x = p.clientX - offsetX;
  let y = p.clientY - offsetY;

  const t = text.getBoundingClientRect();
  const m = match.getBoundingClientRect();

  // Expanded text boundary (blur edge)
  const expanded = {
    left: t.left - GLOW_PADDING,
    right: t.right + GLOW_PADDING,
    top: t.top - GLOW_PADDING,
    bottom: t.bottom + GLOW_PADDING
  };

  // Prevent entering text area
  if (
    x + m.width > expanded.left &&
    x < expanded.right &&
    y + m.height > expanded.top &&
    y < expanded.bottom
  ) {
    return; // BLOCK movement
  }

  match.style.left = x + "px";
  match.style.top = y + "px";

  glowLogic();
}

function endDrag() {
  dragging = false;
}

function glowLogic() {
  const t = text.getBoundingClientRect();
  const m = match.getBoundingClientRect();

  const dx = Math.max(
    (t.left - GLOW_PADDING) - m.right,
    m.left - (t.right + GLOW_PADDING),
    0
  );
  const dy = Math.max(
    (t.top - GLOW_PADDING) - m.bottom,
    m.top - (t.bottom + GLOW_PADDING),
    0
  );

  const distance = Math.hypot(dx, dy);
  const startGlow = 120;

  let glow = 1 - distance / startGlow;
  glow = Math.min(Math.max(glow, 0), 1);

  text.style.opacity = glow;
  text.style.filter = `blur(${10 - glow * 10}px)`;
  text.style.textShadow = `
    0 0 ${10 + glow * 30}px gold,
    0 0 ${20 + glow * 60}px orange,
    0 0 ${40 + glow * 90}px red
  `;
}

// Events
match.addEventListener("mousedown", startDrag);
match.addEventListener("touchstart", startDrag, { passive: false });

document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, { passive: false });

document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);
</script>

</body>
</html>
