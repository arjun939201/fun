<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magic Match Wish</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    background: radial-gradient(circle, #111, #000);
    height: 100vh;
    overflow: hidden;
    font-family: "Nunito", sans-serif;
    user-select: none;
  }

  .instruction {
    position: absolute;
    top: 14px;
    width: 100%;
    text-align: center;
    color: #ffcc66;
    font-size: 1.8em;
    opacity: 0.9;
  }

  .text-box {
    position: absolute;
    top: 32%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }

  .line {
    color: #ffd87a;
    opacity: 0;
    transform: translateY(30px);
    margin: 22px 0;
    font-weight: 700;
    text-shadow:
      0 0 18px rgba(255,215,120,1),
      0 0 50px rgba(255,160,60,1),
      0 0 100px rgba(255,120,30,0.9);
    transition: opacity 2.2s ease, transform 2.2s ease;
  }

  .line.first { font-size: 4.5em; }
  .line.other { font-size: 2.8em; }

  .match {
    position: absolute;
    width: 22px;
    height: 90px;
    left: 50%;
    top: 70px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, #ffb347, #3b2b1f);
    border-radius: 5px;
    box-shadow: 0 0 30px rgba(255,130,0,1);
    cursor: grab;
    touch-action: none;
    z-index: 10;
    transition: top 0.4s ease;
  }

  .fire {
    position: absolute;
    top: -28px;
    left: 50%;
    width: 18px;
    height: 18px;
    background: radial-gradient(circle, #fff6a5, orange, red);
    border-radius: 50%;
    transform: translateX(-50%) scale(0);
    transition: transform 0.4s ease;
  }

  .fire.active {
    width: 34px;
    height: 54px;
    top: -40px;
    animation: flicker 0.18s infinite alternate;
    transform: translateX(-50%) scale(1);
  }

  @keyframes flicker {
    from { transform: translateX(-50%) scale(1); }
    to   { transform: translateX(-50%) scale(1.15); }
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(255, 200, 120, 0.8);
    border-radius: 50%;
    animation: floatUp 10s linear infinite;
  }

  @keyframes floatUp {
    from { transform: translateY(100vh); opacity: 0; }
    15% { opacity: 1; }
    to { transform: translateY(-20vh); opacity: 0; }
  }
</style>
</head>

<body>

<div class="instruction" id="instruction">matchstick jalao 🔥</div>

<div class="text-box">
  <div class="line first">oye.. my pgli ✨</div>
  <div class="line other">pgli, tum sach mein bahut sweet ho 🥰</div>
  <div class="line other">tum jaisi dost ke liye,<br>main khud ko lucky maanta hoon 😌</div>
  <div class="line other">aur haan… tum sabse best ho,<br>ekdum diamond ho 💛</div>
  <div class="line other">isliye hi toh,<br>mera lovely dost tum ho 😍😽</div>
  <div class="line other">hamesha khush rehna,<br>aur apna khayal rakhna pglo 🥹</div>
</div>

<div class="match" id="match">
  <div class="fire" id="fire"></div>
</div>

<script>
const match = document.getElementById("match");
const fire = document.getElementById("fire");
const instruction = document.getElementById("instruction");
const lines = document.querySelectorAll(".line");

let dragging = false;
let offsetY = 0;
let started = false;

for (let i = 0; i < 30; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDelay = Math.random() * 10 + "s";
  document.body.appendChild(p);
}

function startDrag(e) {
  if (started) return;
  dragging = true;
  const r = match.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  offsetY = p.clientY - r.top;
}

function drag(e) {
  if (!dragging || started) return;
  const p = e.touches ? e.touches[0] : e;
  const newTop = p.clientY - offsetY;
  match.style.top = newTop + "px";
  if (newTop > window.innerHeight * 0.22) ignite();
}

function ignite() {
  started = true;
  fire.classList.add("active");
  instruction.innerText = "✨ magic begins ✨";
  match.style.top = "25%";
  revealText();
}

function revealText() {
  let delay = 0;
  lines.forEach(line => {
    setTimeout(() => {
      line.style.opacity = 1;
      line.style.transform = "translateY(0)";
    }, delay += 2200);
  });
}

function endDrag() {
  dragging = false;
}

match.addEventListener("mousedown", startDrag);
match.addEventListener("touchstart", startDrag, { passive: false });
document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, { passive: false });
document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);
</script>

</body>
</html>
