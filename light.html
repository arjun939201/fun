<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magic Match Wish</title>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle, #111, #000);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    font-family: "Segoe UI", sans-serif;
  }

  /* Instruction */
  .instruction {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    color: #ffcc66;
    font-size: 1.2em;
    opacity: 0.8;
    letter-spacing: 1px;
  }

  /* Text container */
  .text-box {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }

  .line {
    font-size: 2.2em;
    color: gold;
    opacity: 0;
    filter: blur(10px);
    margin: 12px 0;
    text-shadow:
      0 0 10px gold,
      0 0 30px orange,
      0 0 60px red;
    transition: opacity 0.4s linear;
  }

  .match {
    position: absolute;
    width: 22px;
    height: 90px;
    left: 50%;
    top: 80px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, #ffb347, #3b2b1f);
    border-radius: 4px;
    box-shadow: 0 0 18px rgba(255, 100, 0, 0.9);
    touch-action: none;
  }

  .fire {
    position: absolute;
    top: -35px;
    left: 50%;
    width: 26px;
    height: 45px;
    background: radial-gradient(circle, #fff176, orange, red);
    border-radius: 50%;
    transform: translateX(-50%);
    animation: flicker 0.15s infinite alternate;
  }

  @keyframes flicker {
    from { transform: translateX(-50%) scale(1); }
    to   { transform: translateX(-50%) scale(1.15); }
  }
</style>
</head>

<body>

<div class="instruction">matchstick neeche le jao</div>

<div class="text-box" id="textBox">
  <div class="line" id="line1">Wish my pgli</div>
  <div class="line" id="line2">pgli tum bahut sweet ho</div>
  <div class="line" id="line3">main khushnaseeb hoon tum jaisi dost ke liye</div>
  <div class="line" id="line4">tum sabse best ho</div>
</div>

<div class="match" id="match">
  <div class="fire"></div>
</div>

<script>
const match = document.getElementById("match");
const lines = document.querySelectorAll(".line");
const firstLine = document.getElementById("line1");
const textBox = document.getElementById("textBox");

let offsetX = 0, offsetY = 0;
let dragging = false;
let sequenceStarted = false;

const GLOW_PADDING = 40;
const START_GLOW_DISTANCE = 120;

function startDrag(e) {
  dragging = true;
  const r = match.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  offsetX = p.clientX - r.left;
  offsetY = p.clientY - r.top;
}

function drag(e) {
  if (!dragging) return;
  const p = e.touches ? e.touches[0] : e;

  let x = p.clientX - offsetX;
  let y = p.clientY - offsetY;

  const t = textBox.getBoundingClientRect();
  const m = match.getBoundingClientRect();

  const expanded = {
    left: t.left - GLOW_PADDING,
    right: t.right + GLOW_PADDING,
    top: t.top - GLOW_PADDING,
    bottom: t.bottom + GLOW_PADDING
  };

  // Block entry into text area
  if (
    x + m.width > expanded.left &&
    x < expanded.right &&
    y + m.height > expanded.top &&
    y < expanded.bottom
  ) return;

  match.style.left = x + "px";
  match.style.top = y + "px";

  glowFirstLine();
}

function glowFirstLine() {
  const t = firstLine.getBoundingClientRect();
  const m = match.getBoundingClientRect();

  const dx = Math.max(
    (t.left - GLOW_PADDING) - m.right,
    m.left - (t.right + GLOW_PADDING),
    0
  );
  const dy = Math.max(
    (t.top - GLOW_PADDING) - m.bottom,
    m.top - (t.bottom + GLOW_PADDING),
    0
  );

  const distance = Math.hypot(dx, dy);
  let glow = 1 - distance / START_GLOW_DISTANCE;
  glow = Math.min(Math.max(glow, 0), 1);

  firstLine.style.opacity = glow;
  firstLine.style.filter = `blur(${10 - glow * 10}px)`;

  if (glow === 1 && !sequenceStarted) {
    sequenceStarted = true;
    revealOthers();
  }
}

function revealOthers() {
  let delay = 0;
  for (let i = 1; i < lines.length; i++) {
    setTimeout(() => {
      lines[i].style.opacity = 1;
      lines[i].style.filter = "blur(0)";
    }, delay += 700);
  }
}

function endDrag() {
  dragging = false;
}

// Events
match.addEventListener("mousedown", startDrag);
match.addEventListener("touchstart", startDrag, { passive: false });

document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, { passive: false });

document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);
</script>

</body>
</html>
