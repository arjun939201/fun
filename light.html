<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magic Match Wish</title>

<style>
  body {
    margin: 0;
    background: radial-gradient(circle, #111, #000);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    font-family: "poppins", sans-serif;
  }

  .instruction {
    position: absolute;
    top: 12px;
    width: 100%;
    text-align: center;
    color: #ffcc66;
    font-size: 2em;
    opacity: 0.9;
    letter-spacing: 1px;
  }

  .drop-zone {
    position: absolute;
    top: 26%;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 160px;
    border: 2px dashed rgba(255,180,80,0.5);
    border-radius: 14px;
    box-shadow: 0 0 30px rgba(255,150,50,0.35);
    pointer-events: none;
  }

  .text-box {
    position: absolute;
    top: 36%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
  }

  .line {
    color: gold;
    opacity: 0;
    filter: blur(14px);
    margin: 20px 0;
    text-shadow:
      0 0 12px gold,
      0 0 40px orange,
      0 0 80px red;
    transition: opacity 2.2s ease, filter 2.2s ease;
  }

  .line.first {
    font-size: 4.2em;   /* bigger */
  }

  .line.other {
    font-size: 2.8em;   /* bigger */
  }

  .match {
    position: absolute;
    width: 22px;
    height: 90px;
    left: 50%;
    top: 90px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, #ffb347, #3b2b1f);
    border-radius: 4px;
    box-shadow: 0 0 22px rgba(255, 100, 0, 0.9);
    touch-action: none;
  }

  .fire {
    position: absolute;
    top: -38px;
    left: 50%;
    width: 30px;
    height: 50px;
    background: radial-gradient(circle, #fff6a5, orange, red);
    border-radius: 50%;
    transform: translateX(-50%);
    animation: flicker 0.18s infinite alternate;
  }

  @keyframes flicker {
    from { transform: translateX(-50%) scale(1); }
    to   { transform: translateX(-50%) scale(1.15); }
  }
</style>
</head>

<body>

<div class="instruction">matchstick neeche le jao</div>
<div class="drop-zone"></div>

<div class="text-box">
  <div class="line first">oye.. my pgli ✨</div>
  <div class="line other">pgli tum sach mein bahut sweet ho 🥰</div>
  <div class="line other">main khud ko lucky maanta hoon tum jaisi dost ke liye 😌</div>
  <div class="line other">aur haan… tum sabse best ho.. diomond ho 💛</div>
    <div class="line other">You're always mera lovely dost 😍😽</div>
<div class="line other">hamesha khush rehna aur khayal rakhna 🥹</div>
</div>

<div class="match" id="match">
  <div class="fire"></div>
</div>

<script>
const match = document.getElementById("match");
const lines = document.querySelectorAll(".line");
const dropZone = document.querySelector(".drop-zone");

let offsetX = 0, offsetY = 0;
let dragging = false;
let locked = false;

function startDrag(e) {
  if (locked) return;
  dragging = true;
  const r = match.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  offsetX = p.clientX - r.left;
  offsetY = p.clientY - r.top;
}

function drag(e) {
  if (!dragging || locked) return;
  const p = e.touches ? e.touches[0] : e;

  match.style.left = (p.clientX - offsetX) + "px";
  match.style.top = (p.clientY - offsetY) + "px";

  checkDrop();
}

function checkDrop() {
  const m = match.getBoundingClientRect();
  const d = dropZone.getBoundingClientRect();

  if (
    m.left > d.left &&
    m.right < d.right &&
    m.top > d.top &&
    m.bottom < d.bottom
  ) {
    lockMatch();
  }
}

function lockMatch() {
  locked = true;
  match.style.left = "50%";
  match.style.top = "30%";
  match.style.transform = "translateX(-50%)";

  revealText();
}

function revealText() {
  let delay = 0;
  lines.forEach(line => {
    setTimeout(() => {
      line.style.opacity = 1;
      line.style.filter = "blur(0)";
    }, delay += 2600);  // slower
  });
}

function endDrag() {
  dragging = false;
}

match.addEventListener("mousedown", startDrag);
match.addEventListener("touchstart", startDrag, { passive: false });
document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, { passive: false });
document.addEventListener("mouseup", endDrag);
document.addEventListener("touchend", endDrag);
</script>

</body>
</html>
